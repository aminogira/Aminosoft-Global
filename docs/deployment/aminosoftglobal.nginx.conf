# Review against nginx -T before installing. Requires the independent certificate below.
server {
    listen 80;
    server_name aminosoftglobal.com www.aminosoftglobal.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aminosoftglobal.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://aminosoftglobal.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.aminosoftglobal.com;
    ssl_certificate /etc/letsencrypt/live/aminosoftglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aminosoftglobal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://aminosoftglobal.com$request_uri;
}
server {
    listen 443 ssl;
    server_name aminosoftglobal.com;
    root /var/www/aminosoftglobal.com/current;
    index index.html;
    autoindex off;
    ssl_certificate /etc/letsencrypt/live/aminosoftglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aminosoftglobal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ /\. { deny all; }
    # Files are not fingerprinted: revalidate rather than caching immutable content.
    location ~* \.(?:css|js|png|jpe?g|svg|woff2?|ico)$ {
        expires 1h;
        try_files $uri =404;
    }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
