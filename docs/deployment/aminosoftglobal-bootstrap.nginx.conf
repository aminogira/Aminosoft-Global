# Temporary HTTP-only vhost for webroot certificate validation.
server {
    listen 80;
    server_name aminosoftglobal.com www.aminosoftglobal.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aminosoftglobal.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
